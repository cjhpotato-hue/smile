.hint{font-family:var(--gothic);font-weight:700;font-size:clamp(14px,1.4vw,18px);color:#111;text-align:center;min-height:1.4em;margin-top:8px}
.hidden{display:none!important}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:12px;height:18px;border-radius:3px;animation:drop linear forwards}
@keyframes drop{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg)}}
.smiles{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.smiles i{position:absolute;bottom:-60px;font-style:normal;animation:up linear infinite;opacity:.55}
@keyframes up{0%{transform:translateY(0) rotate(-10deg)}50%{transform:translate(14px,-60vh) rotate(8deg)}100%{transform:translateY(-125vh) rotate(-6deg)}}
#printArea{display:none}

.siren .bubble:after{left:-14px!important;top:58%;bottom:auto!important;transform:translateY(-50%)!important;border:12px solid transparent!important;border-right-color:#0d3b7a!important;border-left:0!important}

.siren .bubble{margin:0 0 100px -44px!important}
/* 세이렌 캐릭터 · 비눗방울 말풍선 */
.siren .mermaid{font-size:0!important;width:clamp(150px,15vw,200px);animation:bob2 2.4s ease-in-out infinite!important}
.siren .mermaid svg{display:block;width:100%;height:auto;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.siren .mermaid.lying svg{transform:rotate(-82deg) translate(-38px,6px)}
@keyframes bob2{0%,100%{transform:translateY(8px)}50%{transform:translateY(-14px)}}
.siren .tear{animation:drip 1s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(8px);opacity:.3}}
.siren .stars{transform-origin:100px 40px;animation:orbit 2s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.sc-ico svg{width:clamp(70px,7vw,96px);height:auto;display:block}
.siren .bubble{border-radius:50%!important;width:clamp(118px,11vw,146px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;box-sizing:border-box;text-align:center;
 background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.2) 20%,rgba(170,225,255,.16) 52%,rgba(255,170,225,.26) 78%,rgba(255,255,255,.6) 100%)!important;
 border:2px solid rgba(13,59,122,.35)!important;box-shadow:inset -7px -9px 14px rgba(150,110,255,.25),inset 7px 8px 12px rgba(110,215,255,.28),0 6px 14px rgba(13,59,122,.15)!important;
 padding:10px!important;white-space:nowrap;color:#0d3b7a!important;font-size:clamp(16px,1.55vw,21px)!important;line-height:1.05!important;animation:float 3.2s ease-in-out infinite;margin:0 0 110px -40px!important}
.siren .bubble b{color:#a3101c!important}
.siren .bubble:after{content:""!important;position:absolute;left:-12px!important;top:auto!important;bottom:8px!important;transform:none!important;width:16px;height:16px;border-radius:50%;border:2px solid rgba(13,59,122,.3)!important;background:rgba(200,240,255,.35)}
.siren .bubble:before{content:"";position:absolute;left:-24px;bottom:-6px;width:9px;height:9px;border-radius:50%;border:2px solid rgba(13,59,122,.3);background:rgba(200,240,255,.35)}

  </section>
  <section class="panel">

   <div class="ptitle" id="rtitle"><b>2</b>웃음 측정기</div>

   </div>

var stream=null,video=$('video'),actx=null,analyser=null,micBuf=null,hasMic=false;
function audioCtx(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}return actx;}
function startCamera(){
 if(DEMO){$('camHint').textContent='연습 모드 (카메라 없이 점수를 흉내 내요)';return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('camHint').textContent='이 기기에서는 카메라를 쓸 수 없어요.';return;}
 var v={facingMode:'user',width:{ideal:1280},height:{ideal:720}};
 navigator.mediaDevices.getUserMedia({video:v,audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}})
  .then(function(s){hasMic=true;go(s);})
  .catch(function(){navigator.mediaDevices.getUserMedia({video:v}).then(function(s){hasMic=false;go(s);}).catch(function(err){$('camHint').textContent='카메라를 켤 수 없어요. 카메라 권한을 허용해 주세요.';});});
 function go(s){stream=s;video.srcObject=s;var p=video.play();if(p&&p.catch)p.catch(function(){});
  $('camHint').textContent=hasMic?'얼굴이 화면 가운데 오게 서 주세요':'마이크가 꺼져 있어 얼굴 웃음만으로 점수를 매겨요';if(!hasMic)$('mic').classList.add('off');
  if(hasMic)setupMic(s);initFace();}
}
function setupMic(s){try{var c=audioCtx();var src=c.createMediaStreamSource(new MediaStream(s.getAudioTracks()));analyser=c.createAnalyser();analyser.fftSize=1024;micBuf=new Float32Array(analyser.fftSize);src.connect(analyser);}catch(e){hasMic=false;}}
function micDb(){if(!analyser)return -100;analyser.getFloatTimeDomainData(micBuf);var sum=0;for(var i=0;i<micBuf.length;i++)sum+=micBuf[i]*micBuf[i];var r=Math.sqrt(sum/micBuf.length);return 20*Math.log10(r+1e-8);}

/* ---------------- 얼굴 웃음 (MediaPipe Face Landmarker) ---------------- */
var landmarker=null,faceSeen=false,lastFace=0,lastVideoT=-1;
function initFace(){
 var V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
 import(V+'/vision_bundle.mjs').then(function(m){
  return m.FilesetResolver.forVisionTasks(V+'/wasm').then(function(fs){
   return m.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},
    outputFaceBlendshapes:true,runningMode:'VIDEO',numFaces:1});
  });
 }).then(function(lm){landmarker=lm;$('camHint').textContent='얼굴이 화면 가운데 오게 서 주세요';})
   .catch(function(){$('camHint').textContent='얼굴 인식을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';});
}
function readFace(){   // 0~1 활짝 웃는 정도. 얼굴이 없으면 -1
 if(DEMO){return 0.25+0.7*Math.abs(Math.sin(Date.now()/900));}
 if(!landmarker||video.readyState<2)return -1;
 var t=video.currentTime;if(t===lastVideoT)return lastFace;lastVideoT=t;
 var r;try{r=landmarker.detectForVideo(video,performance.now());}catch(e){return -1;}
 if(!r||!r.faceBlendshapes||!r.faceBlendshapes.length){lastFace=-1;return -1;}
 var c=r.faceBlendshapes[0].categories,g={};c.forEach(function(x){g[x.categoryName]=x.score;});
 var smile=((g.mouthSmileLeft||0)+(g.mouthSmileRight||0))/2,cheek=((g.cheekSquintLeft||0)+(g.cheekSquintRight||0))/2,open=g.jawOpen||0;
 var sL=g.mouthSmileLeft||0,sR=g.mouthSmileRight||0;smile=Math.min(sL,sR)*0.7+smile*0.3;   // 양쪽 입꼬리가 모두 올라가야 함
 var v=Math.min(1,smile*0.7+Math.min(open,0.6)*0.25+cheek*0.25);
 v=Math.max(0,Math.min(1,(v-FACE_START)/FACE_RANGE));v=Math.pow(v,1.25);
 lastFace=v;return v;
}
function readVoice(base){   // 0~1 웃음 소리 크기 (주변 소음보다 얼마나 큰지)
 if(DEMO)return 0.2+0.75*Math.abs(Math.sin(Date.now()/600));
 if(!hasMic)return 0;
 var db=micDb();
 var rel=(db-(base+VOICE_GAP))/VOICE_SENS;              // 주변 소음보다 얼마나 큰지
 var abs=(db-LOUD_ZERO_DB)/(LOUD_FULL_DB-LOUD_ZERO_DB);   // 실제로 얼마나 큰지 (조용한 곳에서도 쉽게 안 나오게)
 return Math.max(0,Math.min(1,Math.min(rel,abs)));
}

 },voiceBuf?0:300);

function measure(){
 tries++;drawTries();
 if(tries===1){var bd=loadBoard();bd.people++;saveBoard(bd);drawBoard();}
 var t0=performance.now(),dur=MEASURE_SEC*1000,faces=[],voices=[],best=-1,bestShot=null,base=noiseBase,seen=0,frames=0;
 $('measure').classList.add('on');live=false;
 (function step(){
  var el=performance.now()-t0,f=readFace(),v=readVoice(base);frames++;
  if(f>=0){seen++;faces.push(f);if(f>best){best=f;bestShot=grab();}}
  voices.push(v);setGauge(f,v);var lv=Math.max(0,f)*FACE_WEIGHT+v*VOICE_WEIGHT;if(lv>.55)setSiren('worried',SIREN_SAY.live2);else setSiren('smug',SIREN_SAY.live1);$('mbar').style.width=Math.min(100,el/dur*100)+'%';
  if(el<dur){requestAnimationFrame(step);return;}
  $('measure').classList.remove('on');$('mbar').style.width='0';
  if(!playPart(CUE.shutter,CUE.shutter+0.18)){}
  $('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');
  finish(faces,voices,seen/Math.max(1,frames),bestShot||grab());
 })();
}
function topMean(a,frac){if(!a.length)return 0;var b=a.slice().sort(function(x,y){return y-x;});var n=Math.max(1,Math.round(b.length*frac));var s=0;for(var i=0;i<n;i++)s+=b[i];return s/n;}
function finish(faces,voices,seenRatio,shot){
 var face=topMean(faces,0.7),voice=topMean(voices,0.7);   // 2초 내내 꾸준히 웃어야 높게 나옴
 var fw=FACE_WEIGHT,vw=VOICE_WEIGHT;if(!hasMic&&!DEMO){fw=1;vw=0;}
 var raw=(face*fw+voice*vw)/(fw+vw)*100;
 if(vw>0)raw=Math.min(raw,Math.min(face,voice)*100+BALANCE_BONUS);   // 얼굴과 소리 둘 다 잘해야 함
 if(seenRatio<0.3)raw=Math.min(raw,8);   // 얼굴이 거의 안 보이면 0점
 var score=0;for(var i=0;i<SCORE_TABLE.length;i++)if(raw>=SCORE_TABLE[i][0]){score=SCORE_TABLE[i][1];break;}
 state.face=face;state.voice=voice;state.score=score;state.photo=shot;state.noFace=seenRatio<0.3;state.msg=pickMsg(score);
 showResult();
}

 $('startBtn').classList.add('hidden');$('after').classList.remove('hidden');busy=false;$('startBtn').disabled=false;

 state.receipt=null;if(PRINT_ON){try{state.receipt=drawReceipt();}catch(e){}}

}

 // 도장
 ctx.save();ctx.translate(W/2,y+56);ctx.rotate(-.06);ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,0,170,50,0,0,7);ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,158,40,0,0,7);ctx.stroke();ctx.font="40px "+FUN;ctx.textBaseline='middle';ctx.fillText(pass?'관문 통과!':'다음엔 꼭!',0,2);ctx.restore();y+=130;

function ditherPhoto(src,w,h){
 var c=document.createElement('canvas');c.width=w;c.height=h;
 var x=c.getContext('2d');x.drawImage(src,0,0,w,h);
 var im=x.getImageData(0,0,w,h),d=im.data,n=w*h,L=new Float32Array(n),hist=new Uint32Array(256);
 for(var i=0;i<n;i++){var v=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;L[i]=v;hist[v|0]++;}
 var lo=0,hi=255,acc=0;for(var a=0;a<256;a++){acc+=hist[a];if(acc>n*0.02){lo=a;break;}}
 acc=0;for(var b=255;b>=0;b--){acc+=hist[b];if(acc>n*0.01){hi=b;break;}}
 var span=Math.max(30,hi-lo);
 for(i=0;i<n;i++){var t=Math.min(1,Math.max(0,(L[i]-lo)/span));L[i]=255*Math.pow(t,0.78);}
 for(var y=0;y<h;y++)for(var xx=0;xx<w;xx++){
  var k=y*w+xx,old=L[k],nw=old<128?0:255,err=(old-nw)/8;L[k]=nw;
  if(xx+1<w)L[k+1]+=err; if(xx+2<w)L[k+2]+=err;
  if(y+1<h){if(xx>0)L[k+w-1]+=err;L[k+w]+=err;if(xx+1<w)L[k+w+1]+=err;}
  if(y+2<h)L[k+2*w]+=err;
 }
 for(i=0;i<n;i++){var g=L[i]<128?0:255;d[i*4]=d[i*4+1]=d[i*4+2]=g;d[i*4+3]=255;}
 x.putImageData(im,0,0);return c;
}

function escposBytes(canvas){
 var w=canvas.width,h=canvas.height,px=canvas.getContext('2d').getImageData(0,0,w,h).data;
 var bw=Math.ceil(w/8),BAND=200,bands=Math.ceil(h/BAND);
 var out=new Uint8Array(5+bands*8+bw*h+7),p=0;
 function put(){for(var i=0;i<arguments.length;i++)out[p++]=arguments[i];}
 put(0x1B,0x40,0x1B,0x61,0x00);
 for(var y0=0;y0<h;y0+=BAND){
  var bh=Math.min(BAND,h-y0);
  put(0x1D,0x76,0x30,0x00,bw&255,bw>>8,bh&255,bh>>8);
  for(var y=y0;y<y0+bh;y++){
   for(var bx=0;bx<bw;bx++){
    var b=0;
    for(var k=0;k<8;k++){
     var x=bx*8+k;if(x>=w)continue;
     var i=(y*w+x)*4,lum=px[i]*0.299+px[i+1]*0.587+px[i+2]*0.114;
     if(px[i+3]>0&&lum<185)b|=0x80>>k;
    }
    out[p++]=b;
   }
  }
 }
 put(0x1B,0x64,FEED_LINES);
 put(0x1D,0x56,CUT_MODE,0x00);
 return out.subarray(0,p);
}
function bytesToHex(bytes){var h=new Array(bytes.length);for(var i=0;i<bytes.length;i++)h[i]=(bytes[i]<16?'0':'')+bytes[i].toString(16);return h.join('');}

/* ---- Fully Kiosk 블루투스 직접 출력 ---- */
function fullyApi(){
 try{if(typeof fully!=='undefined'&&fully&&typeof fully.btSendHexData==='function')return fully;}catch(e){}
 try{if(window.top&&window.top.fully&&typeof window.top.fully.btSendHexData==='function')return window.top.fully;}catch(e){}
 return null;
}
function findPrinter(f){
 var list=[];
 try{list=JSON.parse(f.btGetDeviceListJson()||'[]');}catch(e){}
 if(!Array.isArray(list)){var arr=[];for(var key in list)arr.push(list[key]);list=arr;}
 function nameOf(d){return String(d&&(d.name||d.deviceName)||'');}
 var want=PRINTER_NAME?[PRINTER_NAME]:['CPP','Printer','POS','RPP','BT'];
 for(var i=0;i<want.length;i++)for(var j=0;j<list.length;j++)if(nameOf(list[j]).toUpperCase().indexOf(want[i].toUpperCase())>-1)return list[j];
 return list.length===1?list[0]:null;
}
function fullyConnect(f,done){
 try{if(f.btIsConnected()){done(true);return;}}catch(e){}
 var dev=findPrinter(f);
 if(!dev){done(false,'페어링된 영수증 프린터를 찾지 못했습니다. 태블릿 블루투스 설정에서 프린터를 먼저 연결해 주세요.');return;}
 try{if(dev.address||dev.mac)f.btOpenByMac(dev.address||dev.mac);else f.btOpenByName(dev.name||dev.deviceName);}
 catch(e){done(false,'프린터 연결에 실패했습니다.');return;}
 var t0=Date.now();
 (function wait(){
  var ok=false;try{ok=f.btIsConnected();}catch(e){}
  if(ok){done(true);return;}
  if(Date.now()-t0>8000){done(false,'프린터에 연결하지 못했습니다. 프린터 전원과 블루투스를 확인해 주세요.');return;}
  setTimeout(wait,200);
 })();
}
function fullySend(f,bytes,done){
 var hex=bytesToHex(bytes),CH=8192,pos=0;
 (function next(){
  if(pos>=hex.length){done(true);return;}
  var ok=false;try{ok=f.btSendHexData(hex.substr(pos,CH));}catch(e){}
  if(ok===false){done(false);return;}
  pos+=CH;setTimeout(next,40);
 })();
}

 }

};
